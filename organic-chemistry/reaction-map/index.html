<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Chemistry — Reaction Map</title>
<style>
:root{--acc2:#e9effc;--bg:#f4f6fa;--ink:#1b2130;--muted:#6b7385;--line:#cfd5e2;--acc:#2f5fd0;--prep:#1f8a5b;--prep2:#e4f5ec;--rxn:#c2531b;--rxn2:#fdebe0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 14px 8px;position:sticky;top:0;z-index:10}
header h1{margin:0 0 8px;font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.tabs button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:14px 12px 30px}
.lec{display:none}.lec.active{display:block}

/* tree */
.root{display:inline-block;background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:9px 18px;border-radius:12px;margin:4px 0 0 0}
.tree{margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--line);margin-left:16px}
.tree>li{position:relative;padding:10px 0 4px 14px}
.tree>li::before{content:"";position:absolute;left:-14px;top:25px;width:26px;height:2px;background:var(--line)}
.grp{display:inline-block;font-weight:700;font-size:14px;padding:6px 13px;border-radius:999px;letter-spacing:.2px}
.grp.r{background:var(--rxn2);color:var(--rxn)}
.grp.p{background:var(--prep2);color:var(--prep)}
.ge{display:inline-block;line-height:1.7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px;margin:8px 0 2px 0;max-width:100%;overflow-wrap:anywhere}
.p .ge,li.p .ge{border-color:var(--prep)}li.r .ge{border-color:var(--rxn)}
.grp{display:block;width:fit-content}
.leaves{list-style:none;margin:6px 0 0 10px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.leaves>li{position:relative;padding:5px 0 5px 14px}
.leaves>li::before{content:"";position:absolute;left:-14px;top:50%;width:14px;height:2px;background:var(--line)}
.leaf{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:4px solid var(--rxn)}
.p .leaf, li.p .leaf{border-left-color:var(--prep)}
.leaf .nm{font-weight:600;font-size:13px;color:var(--muted);margin-bottom:5px}
.leaf .eq{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;font-weight:700;color:var(--ink);line-height:1.9;white-space:nowrap;overflow:hidden}
.leaf .eq>.fit{display:inline-block;white-space:nowrap;transform-origin:left top;padding-bottom:4px}
.lhs,.rhs{white-space:nowrap;display:inline}
.leaf .eq b{color:var(--acc)}
.ar{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 8px;min-width:64px}
.al{font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:11.5px;padding:0 4px;font-weight:600;color:var(--rxn);white-space:nowrap;line-height:1.1;margin-bottom:-2px}
.p .al,li.p .al{color:var(--prep)}
.as{display:block;width:100%;height:0;border-top:2.5px solid var(--ink);position:relative;margin:4px 0 2px;font-size:0}
.as::after{content:"";position:absolute;right:-2px;top:-6px;border:5px solid transparent;border-left:9px solid var(--ink)}
.sgd{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.sgd>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--acc);list-style:none;display:inline-block;background:var(--acc2,#e9effc);padding:4px 10px;border-radius:999px}
.sgd>summary::-webkit-details-marker{display:none}
.sq{margin:10px 0 4px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;line-height:1.45}
.sqq{font-weight:700;margin-bottom:4px}
.qf{margin:4px 0 8px}.qt7{border-collapse:collapse;font-size:12.5px;width:100%;margin:6px 0;background:#fff}.qt7 th,.qt7 td{border:1px solid #c9ced8;padding:5px 6px;text-align:center;vertical-align:middle}.qt7 th{background:#eef2f7;font-weight:700}.qm{color:#c0392b;font-size:15px}.qf img,.qf svg{max-width:100%;height:auto;max-height:160px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.sqo{color:#2a3140;padding-left:6px}
.sa{margin-top:4px}.sa>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}.sa>summary::-webkit-details-marker{display:none}
.sqa{font-weight:700;color:var(--prep);margin-top:3px}
.root+.sgd{display:block;margin:8px 0 0 0;border:0;padding:0}
.pr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;margin:2px 0}
.ge b{color:var(--ink)}
.pn{font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.ov{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px 10px;margin:4px 0 26px}
.ov .sec:first-of-type{margin-top:4px}
.ovt{font-weight:800;font-size:18px;margin-bottom:6px}
.dt{font-weight:800;font-size:18px;background:var(--ink);color:#fff;display:block;text-align:center;padding:10px 16px;border-radius:12px;margin:0 0 16px}
.ge .or{margin:2px 0}
.or{display:block;text-align:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px;font-weight:700;color:var(--muted);margin:4px 0}
.nw{white-space:nowrap}
.leaf .nt{font-size:12px;color:var(--muted);margin-top:3px}
.sec{margin-top:20px}
.sec:first-of-type{margin-top:4px}
.secttl{font-size:20px;font-weight:800;letter-spacing:.3px;color:#fff;background:var(--rxn);display:table;padding:7px 16px;border-radius:10px;margin:0 0 10px 0}
.sec.p .secttl{background:var(--prep)}

@media(max-width:600px){
 main{padding:10px 6px 30px}
 .tree{padding-left:4px;margin-left:4px}
 .tree>li{padding:10px 0 4px 8px}
 .tree>li::before{left:-8px;width:16px}
 .leaves{margin-left:0;padding-left:4px}
 .leaves>li{padding:5px 0 5px 4px}
 .leaves>li::before{left:-8px;width:8px}
 .leaf{padding:10px 8px}
 .leaf .eq{font-size:15px}
 .al{white-space:nowrap;text-align:center;line-height:1.15}
 .ar{margin:0 5px;min-width:56px}
 .pn{font-size:10px}
}
</style>
</head>

const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const qbox=(lec,key)=>{const a=(SGQ[lec]||{})[key];if(!a)return'';return `<details class="sgd"><summary>📘 Study guide (${a.length})</summary>${a.map(q=>`<div class="sq"><div class="sqq">${esc(q.q)}</div>${q.fig?`<div class="qf">${q.fig}</div>`:""}${q.o.map(o=>`<div class="sqo">${esc(o)}</div>`).join('')}<details class="sa"><summary>Show answer</summary><div class="sqa">${esc(q.a)}</div></details></div>`).join('')}</details>`};
const arrow=t=>{let r=t.replace(/<b>([^<|]+)\|([^<]+)<\/b>/g,'<span class="pr"><b>$1</b><span class="pn">$2</span></span>').replace(/ @([^@]*)@ /g,(m,c)=>`<span class="ar"><span class="al">${c.trim()}</span><span class="as"></span></span>`);
 const parts=r.split(/(<span class="ar">.*?<\/span><\/span>)/);
 return parts.map((x,i)=>i%2?x:(x.trim()?`<span class="${i===0?'lhs':'rhs'}">${x.trim()}</span>`:'')).join(' ');};
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
D.forEach((L,i)=>{
 const b=document.createElement('button');b.textContent=L.n+' '+L.t;b.dataset.l=L.n;if(i===0)b.classList.add('active');tabs.appendChild(b);
 const s=document.createElement('section');s.className='lec'+(i===0?' active':'');s.id='L'+L.n;
 const ov=`<div class="ov"><div class="ovt">⚡ Quick summary</div>${L.trees.map(T=>`<div class="sec ${T.kind}"><div class="secttl">${T.title}</div><div class="root">${T.root}</div>${L.n===4?qbox(4,"ROOT"):""}<ul class="tree">${T.groups.map(G=>`<li class="${T.kind}"><span class="grp ${T.kind}">${G.g}</span>${G.e?`<div class="ge">${arrow(G.e)}</div>`:''}</li>`).join('')}</ul></div>`).join('')}</div>`;
 s.innerHTML=L.n===4?ov:(ov+`<div class="dt">🔍 In detail</div>`+L.trees.map(T=>`<div class="sec ${T.kind}"><div class="secttl">${T.title}</div><div class="root">${T.root}</div>${T.root==="Alcohol  R–OH"?qbox(8,"ROOT"):T.root==="→ Alcohol  R–OH"?qbox(8,"PROOT"):T.root==="Amine  R–NH₂"?qbox(9,"RROOT"):T.root.startsWith("Diazonium")?qbox(9,"DROOT"):T.root==="→ Ether  R–O–R"?qbox(7,"PROOT"):T.root==="Ether  R–O–R"?qbox(7,"ROOT"):T.root==="Epoxide  C–C(O)"?qbox(7,"EROOT"):T.root==="Alkane  R–H"?qbox(4,"ROOT"):T.root==="Alkene  C=C"?qbox(5,"ROOT"):T.root==="→ Aldehyde / Ketone  C=O"?qbox(10,"PROOT"):T.root==="Aldehyde / Ketone  C=O"?qbox(10,"ROOT"):T.root==="→ Carboxylic acid  R–COOH"?qbox(11,"APROOT"):T.root==="Carboxylic acid  R–COOH"?qbox(11,"AROOT"):T.root==="→ Acid derivative  R–CO–L"?qbox(11,"DPROOT"):T.root==="Acid derivative  R–CO–L"?qbox(11,"DRROOT"):""}<ul class="tree">${T.groups.map(G=>`<li class="${T.kind}"><span class="grp ${T.kind}">${G.g}</span>${G.e?`<div class="ge">${arrow(G.e)}</div>`:""}<ul class="leaves">${G.items.map(it=>`<li><div class="leaf"><div class="nm">${it[0]}</div><div class="eq"><span class="fit">${arrow(it[1])}</span></div>${it[2]?`<div class="nt">${it[2]}</div>`:''}${qbox(L.n,it[0])}</div></li>`).join('')}</ul></li>`).join('')}</ul></div>`).join(''));
 main.appendChild(s);
});

function fitEqs(){document.querySelectorAll('.leaf .eq>.fit').forEach(el=>{el.style.transform='';el.style.width='';const w=el.parentElement.clientWidth,sw=el.scrollWidth;if(sw>w){const k=w/sw;el.style.transform=`scale(${k})`;el.style.width=sw+'px';el.parentElement.style.height=(el.getBoundingClientRect().height+6)+'px';}else{el.parentElement.style.height='';}});}
window.addEventListener('load',fitEqs);window.addEventListener('resize',fitEqs);
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const l=b.dataset.l;
 tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
 main.querySelectorAll('.lec').forEach(x=>x.classList.toggle('active',x.id==='L'+l));window.scrollTo({top:0});fitEqs();});
fitEqs();
</script>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulation Fundamentals</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💊%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--ink:#1a2733;--soft:#5b6b78;--line:#dfe4ea}
@media (prefers-color-scheme:dark){:root{--bg:#15191e;--card:#1f252c;--ink:#e8ecf0;--soft:#a3afba;--line:#323a43}}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto;padding:28px 0 40px}
h1{font-size:28px;margin:0 0 6px;text-align:center}
.sub{color:var(--soft);text-align:center;margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;border-inline-start:6px solid var(--c);transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.t{font-weight:700;font-size:18px;direction:ltr;text-align:right}
.s{color:var(--soft);font-size:14px;margin-top:3px}
.soon{display:inline-block;font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-top:6px}
.back{display:inline-block;margin-bottom:24px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--soft)}
</style></head><body><div class="wrap"><a class="back" href="/">→ الرجوع</a><h1 dir="ltr">💊 Formulation Fundamentals</h1><p class="sub">أساسيات التركيبات الدوائية</p><div class="empty">قريباً — الأسئلة بتنضاف هنا</div></div></body></html>
